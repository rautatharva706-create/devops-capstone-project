[nosetests]
verbosity=2
detailed-errors=1
with-coverage=1
cover-package=service
cover-html=1
cover-erase=1

[flake8]
ignore = E501, W503
exclude = .git,__pycache__,venv,build,dist
max-line-length = 127

[pylint]
disable = C0111, C0114, C0115, C0116, R0903, C0103
max-line-length = 127
ignore = venv,.git
